version: 2

# target-branch: every entry below targets the ACTIVE RELEASE BRANCH, not the
# default branch. `main` is the published release — a green Tests run on main
# triggers the PyPI publish — so a dependency bump merged there is one the
# in-flight release does not contain, and someone has to reconcile it by hand
# later. Dependabot reads both this config and the manifests it bumps from the
# branch named here, so bumps are also computed against that branch's lockfiles
# instead of main's.
#
# WHEN CUTTING THE NEXT RELEASE BRANCH: create it off main FIRST, then update
# every target-branch line below. A target-branch naming a branch that does not
# exist makes Dependabot stop opening pull requests, and it fails quietly —
# nothing surfaces except an error on the repository's Dependabot page.
#
# Security updates are NOT governed by this file. Dependabot alerts raise those
# against the default branch whatever is configured here, which is why /web_app
# pull requests appeared for months before this file had an npm entry at all.

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "release/V0.9.2"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    ignore:
      # Major version bumps require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ruff is the generated-code formatter (core/codegen/formatter.py): its exact
      # pin is part of LHP's output contract and every e2e baseline is byte-locked
      # to it, so even a "minor" bump is a formatter migration done deliberately by
      # hand (bump + regenerate all baselines together), never a routine update.
      - dependency-name: "ruff"

  # GitHub Actions (maintains SHA pins)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release/V0.9.2"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Web IDE frontend (`lhp web`). Until this entry existed, /web_app received
  # Dependabot *security* updates only — routine version bumps never happened,
  # so those dependencies moved solely when an advisory fired.
  - package-ecosystem: "npm"
    directory: "/web_app"
    target-branch: "release/V0.9.2"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      npm-production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    ignore:
      # Major version bumps require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
