name: Build and Publish to PyPI

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Release jobs must not restore or populate caches shared with other workflows.
cache-mode: none

concurrency:
  group: lhp-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
      release: ${{ steps.metadata.outputs.release }}
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require successful main-branch CI for this exact commit
        run: |
          count=$(gh run list --workflow python_ci.yml --commit "$SOURCE_SHA" --branch main --event push --status success --json databaseId --jq 'length')
          test "$count" -gt 0
      - name: Validate release identity and package-index state
        id: metadata
        run: python scripts/release_metadata.py

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      UV_PROJECT_ENVIRONMENT: .lhp-release-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify lock and build canonical distributions
        run: |
          python -m pip install uv==0.12.23 twine==6.2.0
          uv lock --check
          python scripts/render_agent_guides.py --check
          bash scripts/build_webapp.sh
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) uv build --build-constraints scripts/release-build-requirements.txt
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  offline:
    needs: [prepare, build]
    uses: ./.github/workflows/offline-bundles.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      distribution-artifact: dist

  stage-release:
    needs: [prepare, build, offline]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: offline-*
          merge-multiple: true
          path: release-assets
      - name: Check completeness and create release checksums
        run: |
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 4
          cd release-assets
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
      - name: Attest canonical distributions and offline archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - name: Stage all assets in a draft release
        run: |
          # matching-refs answers an absent tag with [] (HTTP 200); git/ref answers
          # with a 404 whose body gh writes to stdout. Lookup errors stop the step.
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/v$VERSION\") | .object.sha")
          if [ -z "$tag_sha" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f ref="refs/tags/v$VERSION" -f sha="$SOURCE_SHA"
          elif [ "$tag_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Tag v$VERSION points at $tag_sha, not the tested commit $SOURCE_SHA"
            exit 1
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --draft --title "LHP $VERSION" --generate-notes
          fi
          python scripts/publish_release_assets.py release-assets

  publish:
    needs: [prepare, stage-release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true

  publish-github:
    needs: [prepare, stage-release, publish]
    if: >-
      always() && needs.stage-release.result == 'success' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && needs.prepare.outputs.publish == 'false'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the fully populated GitHub release
        run: gh release edit "v$VERSION" --draft=false
