# Golden fixture: private streaming table, snapshot-CDC mode (SDP `private=True`).
# Mirrors 19_dependency_bindings/param_snapshot_flow.yaml (reuses the existing
# dep_bindings_snapshot_func.py source function) and adds private: true.
# private=True must land on the dp.create_streaming_table(...) target; the
# dp.create_auto_cdc_from_snapshot_flow(...) call is unaffected.
pipeline: private_datasets
flowgroup: st_snapshot_cdc_private
#job_name: j_private

actions:
  - name: private_snapshot_load
    type: load
    readMode: stream
    source:
      type: delta
      database: "${catalog}.${raw_schema}"
      table: dep_bindings_seed
    target: v_private_snapshot_seed
    description: "Load seed rows for the private snapshot-CDC streaming table"

  - name: write_private_snapshot_dim
    type: write
    source: v_private_snapshot_seed
    write_target:
      type: streaming_table
      database: "${catalog}.${silver_schema}"
      table: "private_snapshot_dim"
      comment: "Private streaming table (snapshot-CDC mode); not published to metastore"
      private: true
      mode: "snapshot_cdc"
      snapshot_cdc_config:
        source_function:
          file: "py_functions/dep_bindings_snapshot_func.py"
          function: "next_param_snapshot"
          parameters:
            source_table: "${catalog}.${bronze_schema}.private_orders_st"
        keys: ["id"]
        stored_as_scd_type: 1
    description: "Write private snapshot-CDC-mode streaming table"
